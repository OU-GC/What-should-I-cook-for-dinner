<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚餐煮什麼？ What should I cook?</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header class="hero">
            <h1>晚餐煮什麼？ 🥘</h1>
            <p>用冰箱裡的現有食材，快速決定今晚吃什麼！</p>
        </header>

        <main class="content">
            <section class="input-section glass-panel">
                <h2>1. 你有什麼食材？</h2>
                <div class="input-group">
                    <input type="text" id="ingredient-input" placeholder="例如：雞蛋、高麗菜（按 Enter 加入）">
                    <button id="add-ingredient-btn" class="btn primary">新增</button>
                </div>
                <div id="ingredient-tags" class="tags-container"></div>
            </section>

            <section class="settings-section glass-panel">
                <h2>2. 條件設定</h2>
                
                <div class="setting-group">
                    <label for="tolerance-slider">最多可接受缺少幾樣買不到的食材？ <span id="tolerance-val">1</span> 樣</label>
                    <input type="range" id="tolerance-slider" min="0" max="3" value="1">
                    <p class="help-text" id="tolerance-help">願意補買 1 樣</p>
                </div>

                <div class="setting-group">
                    <label>我的廚具有哪些？</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label"><input type="checkbox" name="appliance" value="快煮鍋"> 快煮鍋</label>
                        <label class="checkbox-label"><input type="checkbox" name="appliance" value="平底鍋"> 平底鍋</label>
                        <label class="checkbox-label"><input type="checkbox" name="appliance" value="微波爐"> 微波爐</label>
                        <label class="checkbox-label"><input type="checkbox" name="appliance" value="明火瓦斯爐"> 明火瓦斯爐</label>
                    </div>
                </div>

                <button id="search-btn" class="btn lg action-btn">幫我推薦菜譜 ✨</button>
            </section>

            <section id="results-section" class="results-section hidden">
                <h2 id="results-title">推薦結果</h2>
                <div id="error-message" class="error-msg hidden"></div>
                
                <div id="fallback-container" class="fallback-card glass-panel hidden">
                    <h3 id="fallback-title"></h3>
                    <ul id="fallback-suggestions"></ul>
                </div>

                <div id="recipes-grid" class="recipes-grid"></div>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
